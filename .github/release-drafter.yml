name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
tag-prefix: v
# The version comes from the git history (scripts/version.mjs, passed in by
# .github/workflows/release-drafter.yml), not from labels; the drafter collects merged pull
# requests into the notes of the next release.
categories:
  - title: Features
    labels: [feature]
  - title: Bug Fixes
    labels: [fix]
  - title: Maintenance
    labels: [chore, dependencies]
# Pull requests are labelled from their branch prefix or from their Conventional Commits title
# (feat:, fix:, ci:, build:, chore:, docs:, ...), so branches such as claude/... or dependabot/...
# are categorised too.
autolabeler:
  - label: feature
    branch:
      - '/feature\/.+/'
    title:
      - '/^feat(\(.+\))?!?:/i'
  - label: fix
    branch:
      - '/bugfix\/.+/'
    title:
      - '/^fix(\(.+\))?!?:/i'
  - label: chore
    branch:
      - '/chore\/.+/'
    title:
      - '/^(build|chore|ci|docs|perf|refactor|style|test)(\(.+\))?!?:/i'
template: |
  ## Changes

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
