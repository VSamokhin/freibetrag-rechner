name: Previews

# Web previews on apps.softlab-previews.pages.dev (section "Freibetrag-Rechner"; behind Cloudflare
# Access): the `dist` build of a green CI run is uploaded to Google Drive as a zip by the server's
# publish.py, which also serves every kept build unpacked, so each one opens in the browser. Keeps the
# newest 3 builds per branch, main included; builds of deleted branches are pruned nightly.
#
# Which CI runs are published: every push to main; a work branch on request, either "Run workflow"
# of CI on that branch or the "preview" label on its pull request (then every push to it while the
# label stays on).
#
# This repository is public, so the build stays on GitHub-hosted runners (CI) and only this job runs
# on the media server: on the publish runner, the only one with the Drive and Cloudflare tokens. It
# is started by workflow_run, so the definition on main runs, never one from a pull request; it only
# downloads the finished build and runs no repository code; and runs from forks are skipped.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: previews-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish web preview
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      ((github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') ||
       github.event.workflow_run.event == 'workflow_dispatch' ||
       github.event.workflow_run.event == 'pull_request')
    runs-on: [self-hosted, publish]
    timeout-minutes: 10
    env:
      EVENT: ${{ github.event.workflow_run.event }}
      PR: ${{ github.event.workflow_run.pull_requests[0].number }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Preview requested?
        id: want
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=true
          if [ "$EVENT" = pull_request ]; then
            labels=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/${PR:?no pull request}" |
              python3 -c 'import json, sys; print(*(l["name"] for l in json.load(sys.stdin)["labels"]))')
            case " $labels " in *" preview "*) ;; *) go=false ;; esac
          fi
          echo "go=$go" >>"$GITHUB_OUTPUT"
          [ "$go" = true ] || echo "::notice::No preview label on #$PR; nothing published."
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.want.outputs.go == 'true'
        with:
          name: dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.want.outputs.go == 'true'
        with:
          node-version: lts/*
      - name: Upload to Google Drive and update the preview page
        if: steps.want.outputs.go == 'true'
        run: |
          # The build stamps its git-derived version into the service worker's cache name.
          version=$(grep -oE 'freibetrag-[0-9]+\.[0-9]+\.[0-9]+' dist/sw.js | head -n 1)
          version=${version#freibetrag-}
          zip="$RUNNER_TEMP/freibetrag-rechner-${version:?no version in dist/sw.js}-web.zip"
          (cd dist && python3 -m zipfile -c "$zip" ./*)
          python3 /preview/publish.py --repo "${GITHUB_REPOSITORY#*/}" --branch "$BRANCH" \
            --commit "$COMMIT" --version "$version" "$zip"
