name: Release drafter

# Labels pull requests from their branch prefix (feature/, bugfix/, chore/) and keeps a draft
# GitHub release for the current version of main. Publishing the draft (which creates the tag
# v<version>) deploys that version to GitHub Pages (pages.yml).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
        with:
          # The version is derived from the git history (scripts/version.mjs).
          fetch-depth: 0
      - name: Read the app version
        if: github.event_name != 'pull_request'
        id: version
        run: echo "version=$(node scripts/version.mjs)" >> "$GITHUB_OUTPUT"
      # Release Drafter v7 split labelling into its own action: on pull requests only the labels are
      # updated, on main the draft release.
      - name: Label the pull request
        if: github.event_name == 'pull_request'
        uses: release-drafter/release-drafter/autolabeler@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update the draft release
        if: github.event_name != 'pull_request'
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          version: ${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
